version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: mockstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mockstack
      POSTGRES_PASSWORD: mockstack
      POSTGRES_DB: mockstack
    ports:
      - "5432:5432"
    volumes:
      - mockstack_pgdata:/var/lib/postgresql/data

volumes:
  mockstack_pgdata:
